image: eclipse-temurin:17-jdk-noble

stages:
  - build

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

# Build a QNN/Hexagon context binary for the Snapdragon 8 Elite Gen 5 (Hexagon V81).
#
# Why CI instead of the local ARM host: QAIRT ships no Linux aarch64 runtime
# libraries, so qairt-quantizer cannot collect activation ranges there
# ("generateActivations: Netrun failure"). On x86_64 the whole chain works
# offline, including qnn-model-lib-generator, which has no aarch64 build at all.
# It also removes the ~8 GB memory ceiling that OOM-killed the ARM conversion.
#
# The QAIRT SDK is fetched from the project's private package registry; it is
# licensed material, so it is never committed to the repository.
build-qnn-context:
  image: python:3.12-bookworm
  stage: build
  timeout: 4h
  variables:
    QNN_VERSION: "2.50.0.260828"
    MODEL_REPO: "Qwen/Qwen3-0.6B"
    CTX_LEN: "128"
  cache:
    key: qnn-python-v1
    paths:
      - .qnn-home
  script:
    - apt-get update -qq && apt-get install -y -qq curl unzip build-essential >/dev/null
    - export DEBIAN_FRONTEND=noninteractive
    - pip install --quiet --target "$CI_PROJECT_DIR/.qnn-home" torch --index-url https://download.pytorch.org/whl/cpu
    - pip install --quiet --target "$CI_PROJECT_DIR/.qnn-home" transformers onnx numpy onnxruntime pyyaml packaging setuptools
    - echo "== fetch QAIRT SDK (licensed, from private package registry) =="
    - >-
      curl --fail --location --output qairt.zip
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/qairt-sdk/${QNN_VERSION}/qairt-${QNN_VERSION}.zip"
    - unzip -q qairt.zip
    - SDK="$CI_PROJECT_DIR/qairt/${QNN_VERSION}"
    - export PYTHONPATH="$CI_PROJECT_DIR/.qnn-home:$SDK/lib/python"
    - export PY="$(command -v python3)"
    - export LD_LIBRARY_PATH="$SDK/lib/x86_64-linux-clang"
    # ---------------------------------------------------------------- export
    - echo "== 1. PyTorch -> ONNX (standard ops only, no ORT fusion) =="
    - bash tools/qnn/export_model.sh "$MODEL_REPO" model.onnx
    # ------------------------------------------------------------- convert
    - echo "== 2. ONNX -> DLC (HTP) =="
    - python3 tools/qnn/make_dims.py model.onnx dims.txt
    - >-
      python3 tools/qnn/onnx_qnn_shim.py "$SDK/bin/x86_64-linux-clang/qairt-converter"
      --input_network model.onnx --output_path model.dlc --target_backend HTP $(cat dims.txt)
    # ----------------------------------------------------------- calibrate
    - echo "== 3. calibration data from a real forward pass =="
    - python3 tools/qnn/make_calibration.py . calib 3
    - cat calib/input_list_0.txt calib/input_list_1.txt calib/input_list_2.txt > calib/all.txt
    # ----------------------------------------------------------- quantize
    - echo "== 4. quantize to int8 (HTP needs real quant encodings) =="
    - python3 "$SDK/bin/x86_64-linux-clang/qairt-quantizer"
        --input_dlc model.dlc --output_dlc model_int8.dlc
        --input_list "$CI_PROJECT_DIR/calib/all.txt"
        --weights_bitwidth 8 --act_bitwidth 8 --bias_bitwidth 32
        --use_per_channel_quantization
    # ----------------------------------------------------- context binary
    - echo "== 5. DLC -> QNN network .so -> hexagon-v81 context binary =="
    - >-
      "$SDK/bin/x86_64-linux-clang/qnn-model-lib-generator"
      -c model_int8.dlc -o model_int8.so
    - >-
      "$SDK/bin/x86_64-linux-clang/qnn-context-binary-generator"
      --backend "$SDK/lib/x86_64-linux-clang/libQairtHtp.so"
      --model model_int8.so --binary_file model_v81.bin --target_platform hexagon-v81
    - ls -la model_v81.bin
    - echo "== publish =="
    - >-
      curl --request PUT --silent --show-error --fail
      --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file model_v81.bin
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/qnn-context/${CI_COMMIT_SHORT_SHA}/model_v81.bin"
    - echo "context binary published"
  artifacts:
    paths:
      - model_v81.bin
      - model_int8.dlc
    expire_in: 30 days
    when: always

build-apk:
  stage: build
  timeout: 90m
  cache:
    key: gradle-cache-v1
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
      - rust/pocketinfer/target
  script:
    - apt-get update -qq && apt-get install -y -qq software-properties-common >/dev/null
    - add-apt-repository -y universe >/dev/null
    - apt-get update -qq && apt-get install -y -qq curl unzip git build-essential ninja-build pkg-config libssl-dev >/dev/null
    # --- Rust toolchain (pure-Rust inference engine) ---
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal >/dev/null
    - . "$HOME/.cargo/env"
    - rustup target add aarch64-linux-android
    - cargo --version
    # --- Android SDK cmdline-tools ---
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - curl -sSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    - unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
    - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
    - export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
    # --- Gradle 8.11.1 ---
    - curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
    - unzip -q /tmp/gradle.zip -d /opt
    - export PATH="/opt/gradle-8.11.1/bin:$PATH"
    - gradle --version | head -5
    # --- Native deps (whisper.cpp only: the LLM engine is Rust) ---
    - bash scripts/fetch-native.sh
    # --- Rust engine unit/smoke tests (host) + cross build for arm64 ---
    - (cd rust/pocketinfer && cargo test --release)
    - bash scripts/build-rust.sh
    # --- Build APK debug ---
    - gradle :app:assembleDebug --no-daemon --stacktrace
    - APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
    - cp "$APK" PocketWorkbench-debug.apk
    - ls -la PocketWorkbench-debug.apk
    # --- Unstripped native libs: needed to symbolicate native crash reports ---
    - 'SYMDIR=$( (ls -d app/build/intermediates/cxx/Debug/*/obj/arm64-v8a app/build/intermediates/cxx/Release/*/obj/arm64-v8a app/.cxx/Debug/*/obj/arm64-v8a app/.cxx/Release/*/obj/arm64-v8a 2>/dev/null || true) | head -1 )'
    - 'if [ -n "$SYMDIR" ] && ls "$SYMDIR"/*.so >/dev/null 2>&1; then mkdir -p native-symbols && cp "$SYMDIR"/*.so native-symbols/ && cp rust/pocketinfer/target/aarch64-linux-android/release/libpocketinfer.so native-symbols/ 2>/dev/null; tar czf native-symbols.tgz -C native-symbols . && ls -la native-symbols; else echo "WARN no unstripped native libs"; fi'
    # --- Pubblica APK nel registry dei pacchetti (URL di download stabile) ---
    - |
      APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)
      test -n "$APP_VERSION"
      VERSION="${APP_VERSION}-${CI_COMMIT_SHORT_SHA}"
      curl --request PUT --silent --show-error --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "PocketWorkbench-debug.apk" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pocket-workbench/${VERSION}/PocketWorkbench-debug-${VERSION}.apk"
    - 'if [ -f native-symbols.tgz ]; then curl --request PUT --silent --show-error --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file native-symbols.tgz "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pocket-workbench/${VERSION}/native-symbols-${VERSION}.tgz"; echo "Simboli pubblicati: native-symbols-${VERSION}.tgz"; fi'
    - 'echo "Package pubblicato: pocket-workbench ${VERSION}"'
  artifacts:
    paths:
      - PocketWorkbench-debug.apk
      - native-symbols.tgz
    expire_in: 90 days
