name: npubench-apk

# Build the NPU measurement app.
#
# It has to be a real APK: the ggml-hexagon backend asks RPCCode for an
# absolute skel URI that is resolved against the calling process's native
# library directory, which only exists for an installed app. From adb shell
# the session fails with 0x80000406.
on:
  push:
    branches: [main]
    paths: ['npubench/**', 'scripts/fetch-geniex.sh', '.github/workflows/npubench-apk.yml']
  workflow_dispatch:

concurrency:
  group: npubench-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up the Android SDK
        run: |
          set -euo pipefail
          # the runner image ships cmdline-tools but not on PATH
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found at $SDKMANAGER"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch the GenieX runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "FATAL: HF_TOKEN secret is not set"; exit 1; }
          bash scripts/fetch-geniex.sh
          test -s npubench/src/main/jniLibs/arm64-v8a/libgeniexbench.so
          test -s npubench/src/main/jniLibs/arm64-v8a/libgeniexbench_exit.so

      - name: Build the APK
        run: gradle :npubench:assembleDebug --no-daemon

      - name: Report the APK
        run: |
          ls -la npubench/build/outputs/apk/debug/*.apk
          du -h npubench/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: npubench-apk
          path: npubench/build/outputs/apk/debug/*.apk
          retention-days: 30
