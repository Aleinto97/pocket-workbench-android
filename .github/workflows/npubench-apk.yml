name: npubench-apk

# Build the NPU measurement app.
#
# It has to be a real APK: the ggml-hexagon backend asks RPCCode for an
# absolute skel URI that is resolved against the calling process's native
# library directory, which only exists for an installed app. From adb shell
# the session fails with 0x80000406.
on:
  push:
    branches: [main]
    paths: ['npubench/**', 'scripts/fetch-geniex.sh', '.github/workflows/npubench-apk.yml']
  workflow_dispatch:

concurrency:
  group: npubench-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up the Android SDK and Gradle
        run: |
          set -euo pipefail
          # the runner image ships cmdline-tools but not on PATH
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found at $SDKMANAGER"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Fetch the GenieX runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "FATAL: HF_TOKEN secret is not set"; exit 1; }
          bash scripts/fetch-geniex.sh
          ls -la npubench/src/main/jniLibs/arm64-v8a | tail -3
          ls -la npubench/src/main/assets

      - name: Build the APK
        run: gradle :npubench:assembleRelease --no-daemon --stacktrace

      - name: Report the APK
        run: |
          ls -la npubench/build/outputs/apk/release/*.apk
          du -h npubench/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: npubench-apk
          path: npubench/build/outputs/apk/release/*.apk
          retention-days: 30
