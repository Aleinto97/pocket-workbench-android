name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build glslc libvulkan-dev spirv-headers
          mkdir -p "$GITHUB_WORKSPACE/build-headers"
          cp -a /usr/include/vulkan /usr/include/spirv "$GITHUB_WORKSPACE/build-headers/"
          echo "VULKAN_HEADERS_DIR=$GITHUB_WORKSPACE/build-headers" >> "$GITHUB_ENV"
          echo "SPIRV_HEADERS_CMAKE_DIR=$(dirname "$(dpkg -L spirv-headers | grep '/SPIRV-HeadersConfig.cmake$' | head -1)")" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch native runtimes
        run: bash scripts/fetch-native.sh
      - name: Build
        run: gradle :app:assembleDebug -Pgpu=true --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketWorkbench-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PocketWorkbench-debug
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.${{ github.run_number }}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Pocket Workbench $TAG (debug)" \
            --notes "Automated debug APK from commit ${{ github.sha }}. Engineering preview: not device-validated." || \
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.apk
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.apk
